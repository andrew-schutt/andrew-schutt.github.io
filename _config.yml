title:           Andrew Schutt
email:           me@andrew-schutt.com
description:     welcome to my little corner of the internet
author:          Andrew Schutt
baseurl:         ""
url:             "http://andrew-schutt.com"
github_username:  andrew-schutt
devto_username:   andrewschutt
show_downloads:   false

# Build settings
remote_theme:       StartBootstrap/startbootstrap-clean-blog-jekyll
paginate:           5
paginate_path:      "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site
  - jekyll-remote-theme
  - jekyll-target-blank

include: [".well-known"]

# Silence Sass deprecation warnings coming from the remote theme's bundled
# Bootstrap SCSS. There is no local SCSS in this repo, so every deprecation
# originates in theme/dependency stylesheets we don't control.
sass:
  quiet_deps: true
  # The theme's entry stylesheet (assets/main.scss) uses a top-level @import,
  # whose deprecation quiet_deps can't reach; silence that one id too.
  silence_deprecations:
    - import

defaults:
  - scope:
      path: "_posts/images"
    values:
      image: true
